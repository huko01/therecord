:root{--d:min(78vw,340px);--w:min(80vw,340px);--sp:30px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#000;color:#fff;font-family:"Metropolis",-apple-system,"Helvetica Neue",Arial,sans-serif;overflow:hidden}
header{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:20}
header::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#000;z-index:-1}
.btn{width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(10px)}
.btn svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn.on svg{fill:#fff}
.logo{width:34px;height:34px}
#home{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;perspective:900px;perspective-origin:50% 50%;scrollbar-width:none}
#home::-webkit-scrollbar{display:none}
#list{padding:44vh 0 44vh;transform-style:preserve-3d}
.card{position:relative;width:var(--w);height:calc(var(--w)*.42);margin:0 auto;transform-style:preserve-3d;cursor:pointer}
.face{position:absolute;left:0;width:var(--w);height:var(--w);bottom:var(--sp);transform-origin:50% 100%;border-radius:3px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.card.up .face{bottom:auto;top:var(--sp);transform-origin:50% 0}
.spine{position:absolute;left:0;bottom:0;width:var(--w);height:var(--sp);display:flex;align-items:center;justify-content:center;padding:0 12px;font-size:13px;border-radius:2px;box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.card.up .spine{bottom:auto;top:0}
.spine span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
.spine b{font-weight:700}
/* detail */
#detail{position:fixed;inset:0;background:#000;z-index:30;visibility:hidden;opacity:0;transition:opacity .35s,visibility 0s .35s}
#detail.show{visibility:visible;opacity:1;transition:opacity .35s}
#pager{position:absolute;inset:0;display:flex;overflow-x:hidden;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;scroll-behavior:smooth}
#pager.ready{overflow-x:auto}
#pager::-webkit-scrollbar{display:none}
.page{flex:0 0 100%;scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:84px 24px 40px;overflow:hidden}
#booklet{align-items:stretch;justify-content:flex-start;background:linear-gradient(90deg,#111,#000);overflow-y:auto;overflow-x:hidden;padding-bottom:calc(110px + env(safe-area-inset-bottom,0px));scrollbar-width:none}
#booklet::-webkit-scrollbar{display:none}
#booklet>*{flex:none}
.bk-top{display:flex;gap:16px;align-items:center;margin-bottom:22px}
.bk-cv{width:96px;height:96px;border-radius:4px;object-fit:cover;background:#161616;box-shadow:0 8px 24px rgba(0,0,0,.6);flex:none}
.bk-top div{min-width:0}
#booklet h2{margin:0 0 4px;font-size:24px;line-height:1.15;overflow-wrap:anywhere}
#booklet .a{font-size:16px;opacity:.7}
.bk-info{display:grid;grid-template-columns:1fr 1fr;gap:1px;margin:0 0 26px;border-radius:14px;overflow:hidden;background:rgba(255,255,255,.08)}
.bk-info div{background:#101010;padding:11px 14px;min-width:0}
.bk-info dt{font-size:11px;text-transform:uppercase;letter-spacing:.07em;opacity:.45;margin-bottom:3px}
.bk-info dd{margin:0;font-size:14px;font-weight:600;overflow-wrap:anywhere}
.bk-info .w{grid-column:1/-1}
#booklet h4{margin:0 0 4px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;opacity:.55}
#booklet ol{margin:0;padding:0;list-style:none;counter-reset:n}
#booklet li{display:flex;gap:14px;align-items:baseline;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.1);counter-increment:n;font-size:15px}
#booklet li::before{content:counter(n);flex:none;width:22px;opacity:.45;text-align:right;font-size:13px}
#booklet li span{min-width:0;overflow-wrap:anywhere}
#booklet li em{margin-left:auto;padding-left:8px;flex:none;font-style:normal;opacity:.45;font-size:13px;font-variant-numeric:tabular-nums}
#dnav{position:absolute;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;align-items:center;gap:8px;z-index:6;opacity:0;transform:translateY(12px);pointer-events:none;transition:opacity .4s,transform .4s}
#dnav.show{opacity:1;transform:none}
#dnav.show>*{pointer-events:auto}
#dnav .pill{position:relative;display:flex;padding:4px;border-radius:24px;background:rgba(255,255,255,.12);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
#dnav .pill button{position:relative;z-index:1;width:48px;height:36px;border:0;background:none;display:grid;place-items:center;cursor:pointer}
#dnav .pill svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#dnav .pill i{position:absolute;left:4px;top:4px;width:48px;height:36px;border-radius:20px;background:rgba(255,255,255,.24);transition:transform .35s cubic-bezier(.3,.8,.3,1)}
#dnav .pill[data-m="p"] i{transform:translateX(48px)}
#dnav .rb{width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.12);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:none;place-items:center;cursor:pointer}
#dnav.in .rb{display:grid}
#dnav .rb svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#dnav .rb.on{background:#fff}
#bFav.on svg{stroke:#000;fill:#000}
#bPend.on svg{stroke:#000;fill:none}
#bDel svg{stroke:#ff5a5a}
#bDel:active{background:rgba(255,90,90,.25)}
.disc{width:var(--d);aspect-ratio:1;border-radius:50%;cursor:pointer;position:relative;background:conic-gradient(from 20deg,#cfd6e6,#8e9ab5,#f2e9ff,#9fb9c9,#e8f1ee,#a89bb8,#dfe3ee,#8e9ab5,#cfd6e6);box-shadow:0 0 0 1px rgba(255,255,255,.2),0 25px 60px rgba(0,0,0,.8);transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.disc::before{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,transparent 0 22%,rgba(0,0,0,.18) 22.5%,transparent 24% 100%)}
.disc::after{content:"";position:absolute;inset:36%;border-radius:50%;background:#000;box-shadow:0 0 0 14px rgba(255,255,255,.35)}
.disc.out{transform:translateY(-6vh) scale(1.06)}
.disc.out i{animation:spin 2.4s linear infinite}
.disc i{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,transparent,rgba(255,255,255,.55) 8%,transparent 16%,transparent 50%,rgba(255,255,255,.4) 58%,transparent 66%)}
@keyframes spin{to{transform:rotate(360deg)}}
#sleeve{position:absolute;left:50%;top:50%;width:var(--d);aspect-ratio:1;margin-left:calc(var(--d) / -2);margin-top:calc(var(--d) / -2);perspective:1400px;z-index:5;pointer-events:none;transition:transform .55s cubic-bezier(.5,.05,.75,.35)}
#sleeve .door{position:absolute;inset:0;transform-origin:left center;transition:transform 1s cubic-bezier(.6,0,.2,1);transform-style:preserve-3d;border-radius:4px;overflow:hidden;box-shadow:0 25px 60px rgba(0,0,0,.8)}
#sleeve.open .door{transform:rotateY(-172deg)}
#sleeve.exit{transform:translateX(calc(-50vw - var(--d)))}
#sleeve.gone{display:none}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:#fff;color:#000;padding:10px 16px;border-radius:20px;font-size:13px;opacity:0;transition:.3s;z-index:60;pointer-events:none;max-width:88vw;text-align:center}
#toast.s{opacity:1;transform:translate(-50%,0)}

#search{position:fixed;inset:0;background:#000;z-index:25;visibility:hidden;opacity:0;transition:opacity .25s,visibility 0s .25s;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
#search.show{visibility:visible;opacity:1;transition:opacity .25s}
.sh{display:flex;gap:10px;align-items:center;padding:11px 16px}
#q{flex:1;min-width:0;height:42px;border-radius:21px;border:0;background:rgba(255,255,255,.12);color:#fff;font:16px "Metropolis",sans-serif;padding:0 16px;outline:none;-webkit-appearance:none}
#q::placeholder{color:rgba(255,255,255,.45)}
#res{flex:1;overflow-y:auto;padding:4px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.row{display:flex;gap:14px;align-items:center;padding:9px 0;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.08)}
.row img{width:56px;height:56px;border-radius:3px;background:#161616;object-fit:cover;flex:none}
.row div{min-width:0}
.row b{display:block;font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row span{display:block;font-size:13px;opacity:.55;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msg{text-align:center;opacity:.45;font-size:14px;margin-top:40px}
#empty{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;opacity:.5;font-size:15px;line-height:1.5;padding:0 40px;pointer-events:none}
.face{background-size:cover;background-position:center;background-color:#111}
#door{background-size:cover;background-position:center}

#res h4{margin:18px 0 6px;font-size:13px;font-weight:600;opacity:.55;text-transform:uppercase;letter-spacing:.06em}
.arts{display:flex;gap:16px;overflow-x:auto;padding:6px 0 8px;scrollbar-width:none}
.arts::-webkit-scrollbar{display:none}
.art{flex:none;width:78px;text-align:center;cursor:pointer}
.art img{width:78px;height:78px;border-radius:50%;object-fit:cover;background:#161616;display:block}
.art span{display:block;margin-top:6px;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ah{display:flex;align-items:center;gap:14px;padding:8px 0 4px}
.ah img{width:64px;height:64px;border-radius:50%;object-fit:cover;background:#161616}
.ah b{font-size:22px;font-weight:700}
#mode{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;padding:4px;border-radius:24px;background:rgba(255,255,255,.12);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);z-index:20;touch-action:pan-y}
#mode button{position:relative;z-index:1;width:48px;height:36px;border:0;background:none;display:grid;place-items:center;cursor:pointer}
#mode svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round}
#mode i{position:absolute;left:4px;top:4px;width:48px;height:36px;border-radius:20px;background:rgba(255,255,255,.24);transition:transform .35s cubic-bezier(.3,.8,.3,1)}
#mode[data-m="h"] i{transform:translateX(48px)}
#home.h{overflow-x:auto;overflow-y:hidden}
#home.h #list{padding:0 calc(50vw - var(--w)*.21);height:100%;width:max-content;display:flex;align-items:center}
#home.h .card{width:calc(var(--w)*.42);height:var(--w);flex:none}
#home.h .face{left:auto;bottom:auto;top:0;right:var(--sp);transform-origin:100% 50%}
#home.h .card.up .face{right:auto;left:var(--sp);top:0;bottom:auto;transform-origin:0 50%}
#home.h .spine{left:auto;right:0;top:0;bottom:auto;width:var(--sp);height:var(--w);writing-mode:vertical-rl;transform:rotate(180deg);padding:12px 0}
#home.h .card.up .spine{left:0;right:auto;top:0;bottom:auto}
#home.h .spine span{max-width:none;max-height:100%}
#bLib .c{display:none}
#bLib.on .c{display:block}
#bLib.on .p{display:none}
#bLib.on{background:#fff}
#bLib.on svg{stroke:#000;fill:none}
.disc{opacity:0;transform:scale(.7);transition:transform .8s cubic-bezier(.2,.8,.2,1),opacity .6s}
.disc.rev{opacity:1;transform:none}
.disc.out{opacity:1;transform:translateY(-6vh) scale(1.04)}
#splash{position:fixed;inset:0;background:#000;z-index:100;display:grid;place-items:center;transition:opacity .7s ease}
#splash.hide{opacity:0;pointer-events:none}

/* biblioteca */
#mode{left:calc(50% - 27px)}
#libBtn{position:fixed;left:calc(50% + 35px);bottom:calc(18px + env(safe-area-inset-bottom,0px));width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.12);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:grid;place-items:center;cursor:pointer;z-index:20}
#libBtn svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#libBtn.act::after{content:"";position:absolute;top:9px;right:9px;width:9px;height:9px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px #2b2b2b}
#detail header{display:grid;grid-template-columns:1fr auto 1fr}
#detail .hr{justify-self:end;display:flex;gap:8px}
#detail .hr.in #bLib{display:none}


/* Ajustes de controles solicitados: favoritos/pendientes arriba y papelera solo en información */
#detail header{position:relative;grid-template-columns:1fr auto 1fr}
#albumTopActions{position:absolute;right:16px;top:50%;transform:translateY(-50%);display:flex;gap:8px;align-items:center;flex-direction:row}
#albumTopActions .rb{box-sizing:border-box;width:42px;height:42px;flex:0 0 42px;border-radius:50%;border:0;background:rgba(255,255,255,.12);display:grid;place-items:center;cursor:pointer;padding:0}
#albumTopActions #bFavTop,#albumTopActions #bPendTop{opacity:0;transform:translateX(12px);width:0;flex-basis:0;margin:0;overflow:hidden;pointer-events:none;transition:opacity .18s ease,transform .22s ease,width .22s ease,flex-basis .22s ease}
#albumTopActions.open #bFavTop,#albumTopActions.open #bPendTop{opacity:1;transform:translateX(0);width:42px;flex-basis:42px;pointer-events:auto}
#albumTopActions #bTopMore{order:3}
#albumTopActions #bPendTop{order:2}
#albumTopActions #bFavTop{order:1}
#albumTopActions #bTopMore svg{transition:transform .2s ease}
#albumTopActions.open #bTopMore svg{transform:rotate(45deg)}
#albumTopActions .rb svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#albumTopActions #bFavTop.on{background:#fff}
#albumTopActions #bFavTop.on svg{stroke:#000;fill:#000}
#albumTopActions #bPendTop.on{background:#fff}
#albumTopActions #bPendTop.on svg{stroke:#000}
#dnav .rb#bFav,#dnav .rb#bPend{display:none!important}
#dnav .rb#bDel{display:none}
#dnav.info .rb#bDel{display:grid;order:0}
#dnav.info .pill{order:1}
#dnav.info{gap:8px}
#dnav.preparing{opacity:0!important;transform:translateY(12px)!important;pointer-events:none!important;transition:none!important}

/* Confirmación integrada y apertura del álbum */
#confirmDelete{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:24px;background:rgba(0,0,0,.68);opacity:0;visibility:hidden;transition:opacity .2s ease,visibility 0s .2s}
#confirmDelete.show{opacity:1;visibility:visible;transition:opacity .2s ease}
#confirmDelete .confirm-card{width:min(100%,360px);padding:24px;border:1px solid rgba(255,255,255,.12);border-radius:20px;background:#1b1b1b;box-shadow:0 24px 70px rgba(0,0,0,.55);transform:translateY(12px) scale(.98);transition:transform .2s ease}
#confirmDelete.show .confirm-card{transform:none}
#confirmDelete h2{margin:0 0 10px;font-size:20px}
#confirmDelete p{margin:0;color:rgba(255,255,255,.68);font-size:14px;line-height:1.5}
#confirmDelete .confirm-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}
#confirmDelete button{font:inherit;border:0;border-radius:12px;padding:11px 15px;cursor:pointer}
#cancelDelete{color:#fff;background:rgba(255,255,255,.12)}
#confirmDeleteAction{color:#fff;background:#c93d3d}
/* El disco ocupa exactamente el mismo cuadrado y centro que la portada. */
#pager>.page:nth-child(2){padding:0}
#confirmWipe{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:24px;background:rgba(0,0,0,.68);opacity:0;visibility:hidden;transition:opacity .2s ease,visibility 0s .2s}

<script>
const $=s=>document.querySelector(s);
setTimeout(()=>{const sp=$("#splash");if(sp)sp.classList.add("hide")},3000);
const LS={get(k,d){try{return localStorage.getItem(k)||d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const regionOf=()=>{for(const l of (navigator.languages||[navigator.language||""])){const m=/[-_]([A-Za-z]{2})\b/.exec(l);if(m)return m[1].toLowerCase()}return "us"};
let service=LS.get("tr_service","Apple Music"), country=regionOf();
/* ---------- Textos (siempre en inglés) ---------- */
const EN={
  settings:"Settings",done:"Done",general:"General",language:"Language",theme:"Theme",music:"Music",playWith:"Play with",country:"Store country",
  data:"Data",export:"Export backup",exportSub:"Save your library to a file",import:"Import backup",importSub:"Restore a saved backup",
  backupRem:"Backup reminder",never:"Never",bhNever:"No backup reminders.",bh1:"I'll remind you to back up after every new album.",bhN:"I'll remind you to back up every {0} new albums.",
  clear:"Clear library",clearSub:"Remove all albums from this device",foot:"The Record · stored on your device",
  yourName:"Your name",tapPhoto:"Tap the photo to change it",removePhoto:"Remove",statAlb:"Albums",statFav:"Favorites",statPen:"Pending",
  alb1:"album",albN:"albums",
  wipeText:"Everything saved on this device ({0}) will be removed. This can't be undone.",cancel:"Cancel",clearBtn:"Clear all",
  delTitle:"Delete album?",del:"Delete",delText:"“{0}” by {1} will be removed from your library, favorites, and pending.",
  svc:"Playing with {0}",store:"Store changed",cleared:"Library cleared",exported:"Backup exported",imported:"Imported: {0}",badFile:"Invalid file",photoErr:"Couldn't use that photo",
  backupNow:"Time for a backup · Settings › Data › Export",
  added:"Added to your library",addedSuffix:" · added to your library",favOn:"Added to favorites",favOff:"Removed from favorites",pendOn:"Marked as pending",pendOff:"Removed from pending",deleted:"Album deleted",
  opening:"Opening in {0}…",loadingAlb:"Loading album…",loadFail:"Could not load album",
  search:"Search",hint:"Search for an album, EP, or artist",searching:"Searching…",sfail:"Search failed. Check your connection.",artists:"Artists",albEps:"Albums and EPs",noRes:"No results",loading:"Loading…",noAlbEp:"No albums or EPs found",artFail:"Could not load artist",
  emptyLib:"Your library is empty.<br>Tap search to find an album.",emptyFilt:"No albums match these filters.<br>Change or reset the library.",
  type:"Type",release:"Release",label:"Label",genre:"Genre",tracks:"Tracks",duration:"Duration",
  library:"Library",reset:"Reset",view:"View",all:"All",favs:"Favorites",pend:"Pending",selArtist:"Select artist",selColors:"Select colors",noArtists:"No artists yet",noAlbums:"No albums yet",sortBy:"Sort by",more:"More",
  o_t:"Name (A–Z)",o_a:"Artist (A–Z)",o_d:"Duration",o_r:"Release date",a_Album:"Albums only",a_EP:"EPs only",doneN:"Done · {0}",
  c_red:"red",c_orange:"orange",c_yellow:"yellow",c_green:"green",c_turquoise:"turquoise",c_blue:"blue",c_purple:"purple",c_pink:"pink",c_brown:"brown",c_black:"black",c_gray:"gray",c_white:"white"};
function T(k,...a){const s=EN[k]??k;return s.replace(/\{(\d)\}/g,(m,i)=>a[i])}
const cnt=(n,k)=>n+" "+T(k+(n===1?"1":"N"));

const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- Base de datos local (IndexedDB) ---------- */
const DB={
  _p:null,
  open(){return this._p||(this._p=new Promise((res,rej)=>{const r=indexedDB.open("therecord",1);r.onupgradeneeded=()=>r.result.createObjectStore("albums",{keyPath:"id"});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))},
  async tx(mode,fn){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction("albums",mode),q=fn(t.objectStore("albums"));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)})},
  all(){return this.tx("readonly",s=>s.getAll())},
  get(id){return this.tx("readonly",s=>s.get(id))},
  put(a){return this.tx("readwrite",s=>s.put(a)).catch(()=>{})},
  del(id){return this.tx("readwrite",s=>s.delete(id)).catch(()=>{})},
  clear(){return this.tx("readwrite",s=>s.clear()).catch(()=>{})}
};

/* ---------- API de Deezer (sin clave) ---------- */
function jsonp(url){return new Promise((res,rej)=>{
  const cb="_cb"+Math.random().toString(36).slice(2),s=document.createElement("script");
  const end=()=>{clearTimeout(t);delete window[cb];s.remove()};
  const t=setTimeout(()=>{end();rej(new Error("timeout"))},9000);
  window[cb]=d=>{end();res(d)};s.onerror=()=>{end();rej(new Error("jsonp"))};
  s.src=url+"&callback="+cb;document.head.appendChild(s);
})}
const dz=p=>jsonp("https://api.deezer.com"+p+(p.includes("?")?"&":"?")+"output=jsonp").then(j=>{if(j&&j.error)throw new Error("dz");return j});
async function ap(url){try{const r=await fetch(url);if(!r.ok)throw 0;return await r.json()}catch(e){return jsonp(url)}}
const isAlb=r=>r.record_type==="album"||r.record_type==="ep";
const typeOf=r=>r.record_type==="ep"?"EP":"Album";
async function build(id){
  const c=await dz("/album/"+id);
  let tr=(c.tracks&&c.tracks.data)||[];
  if(c.nb_tracks>tr.length){try{const t=await dz(`/album/${id}/tracks?limit=200`);if(t.data&&t.data.length>=tr.length)tr=t.data}catch(e){}}

function famOf(h){
  const n=parseInt(h.slice(1),16),r=(n>>16)/255,g=((n>>8)&255)/255,b=(n&255)/255;
  const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,d=mx-mn,s=d===0?0:d/(1-Math.abs(2*l-1));
  if(l<.16)return "black";
  if(l>.88||(l>.75&&s<.15))return "white";
  if(s<.15)return "gray";
  let h2=mx===r?((g-b)/d+(g<b?6:0)):mx===g?(b-r)/d+2:(r-g)/d+4;h2*=60;
  if(h2<10||h2>=345)return "red";
  if(h2<45)return l<.36?"brown":"orange";
  if(h2<70)return l<.3?"brown":"yellow";
  if(h2<165)return "green";
  if(h2<200)return "turquoise";
  if(h2<255)return "blue";
  if(h2<310)return "purple";
  return "pink";
}

  if(F.ar.length)L=L.filter(a=>F.ar.includes(a.a));
  if(F.t)L=L.filter(a=>kindOf(a)===F.t);
  if(F.s==="t")L=[...L].sort((x,y)=>cmp(x.t,y.t));
  else if(F.s==="a")L=[...L].sort((x,y)=>cmp(x.a,y.a)||cmp(x.t,y.t));
  else if(F.s==="d")L=[...L].sort((x,y)=>durOf(y)-durOf(x));
  else if(F.s==="r")L=[...L].sort((x,y)=>String(y.rd||y.y||"").localeCompare(String(x.rd||x.y||"")));
  return L;
}
function apply(){LS.set("tr_lib",JSON.stringify(F));render();home.scrollTop=0;home.scrollLeft=0;tilt()}
/* ---------- Biblioteca (mismo estilo que Ajustes) ---------- */
const libEl=$("#lib"),LPAGES={main:"Library",view:"View",artist:"Artist",sort:"Sort by",type:"Type"};
let lpage="main";
function lfit(){const p=libEl.querySelector('.set-page[data-p="'+lpage+'"]');if(p)$("#libView").style.height=p.firstElementChild.offsetHeight+"px"}
function lgo(p,instant){
  if(instant)libEl.classList.add("nt");
  lpage=p;
  libEl.querySelectorAll(".set-page").forEach(el=>{const n=el.dataset.p;el.classList.toggle("on",n===p);el.classList.toggle("left",n==="main"&&p!=="main");if(n===p)el.scrollTop=0});
  const t=$("#libTitle");t.textContent=LPAGES[p];

}
const CHK='<svg class="s-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const CHV='<svg class="s-chev" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>';
function drawArtists(){
  const m=new Map();ALBUMS.filter(a=>a.lib).forEach(a=>m.set(a.a,(m.get(a.a)||0)+1));
  const q=($("#lArtQ").value||"").trim().toLowerCase();
  const opt=(a,c)=>`<button type="button" class="s-row${F.ar.includes(a)?" sel":""}" data-lk="a" data-lv="${esc(a)}"><div class="s-txt"><b>${esc(a)}</b></div><span class="s-val">${c}</span>${CHK}</button>`;
  const list=[...m].filter(([a])=>!q||a.toLowerCase().includes(q)).sort((x,y)=>cmp(x[0],y[0]));
  $("#lArtist").innerHTML=list.length?`<div class="s-card">${list.map(([a,c])=>opt(a,c)).join("")}</div>`:`<p class="s-note">${m.size?"No artists found":T("noArtists")}</p>`;
  lfit();
}
$("#lArtQ").addEventListener("input",drawArtists);
function drawLib(){
  const L=ALBUMS.filter(a=>a.lib),n=visible().length;
  const opt=(k,v,label,sel,val)=>`<button type="button" class="s-row${sel?" sel":""}" data-lk="${k}" data-lv="${esc(v)}"><div class="s-txt"><b>${esc(label)}</b></div>${val?`<span class="s-val">${esc(val)}</span>`:""}${CHK}</button>`;
  const nav=(g,label,val)=>`<button type="button" class="s-row" data-lgo="${g}"><div class="s-txt"><b>${label}</b></div><span class="s-val">${esc(val)}</span>${CHV}</button>`;
  const vLab={all:T("all"),fav:T("favs"),pend:T("pend")}[F.v]||T("all");
  const aLab=F.ar.length===1?F.ar[0]:F.ar.length?F.ar.length+" selected":T("all");
  $("#lMain").innerHTML=`<div class="s-card">${nav("view",T("view"),vLab)}${nav("artist","Artist",aLab)}${nav("sort",T("sortBy"),F.s?T("o_"+F.s):"Default")}${nav("type",T("type"),F.t?T("a_"+F.t):T("all"))}</div>`
    +(active()?`<div class="s-card"><button type="button" class="s-row" id="lreset"><div class="s-txt"><b>${T("reset")}</b></div></button></div>`:"")
    +`<p class="s-note">${cnt(n,"alb")}</p>`;
  $("#lView").innerHTML=`<div class="s-card">${opt("v","all",T("all"),F.v==="all")}${opt("v","fav",T("favs"),F.v==="fav")}${opt("v","pend",T("pend"),F.v==="pend")}</div>`;
  drawArtists();
  $("#lSort").innerHTML=`<div class="s-card">${opt("s","","Default",!F.s)}${ORD.map(([v])=>opt("s",v,T("o_"+v),F.s===v)).join("")}</div>`;
  $("#lType").innerHTML=`<div class="s-card">${opt("t","",T("all"),!F.t)}${ADI.map(([v])=>opt("t",v,T("a_"+v),F.t===v)).join("")}</div>`;
  lfit();
}
function closeLib(){libEl.classList.remove("show");libEl.setAttribute("aria-hidden","true")}
$("#libBtn").onclick=()=>{$("#lArtQ").value="";drawLib();lgo("main",true);libEl.setAttribute("aria-hidden","false");libEl.classList.add("show")};
libEl.addEventListener("click",e=>{
  if(e.target.classList.contains("set-scrim")){closeLib();return}
  const b=e.target.closest("button");if(!b)return;
  const d=b.dataset;
  if(d.lgo){lgo(d.lgo);return}
  if(b.id==="lBack"){lgo("main");return}
  if(b.id==="lreset"){F={v:"all",s:"",t:"",ar:[]};apply();drawLib();return}
  if(!d.lk)return;
  const k=d.lk,v=d.lv;
  if(k==="a"){F.ar=tg(F.ar,v);apply();drawLib();return}
  if(k==="v")F.v=v;else if(k==="s")F.s=v;else if(k==="t")F.t=v;
  apply();drawLib();
  setTimeout(()=>lgo("main"),240);
});
(function(){
  const sh=libEl.querySelector(".set-sheet");let y0=0,dy=0,t0=0,drag=false;
  [libEl.querySelector(".set-grab"),libEl.querySelector(".set-head")].forEach(el=>{
    el.addEventListener("pointerdown",e=>{if(e.target.closest("button"))return;drag=true;y0=e.clientY;dy=0;t0=performance.now();el.setPointerCapture(e.pointerId);sh.style.transition="none"});
    el.addEventListener("pointermove",e=>{if(!drag)return;dy=Math.max(0,e.clientY-y0);sh.style.transform=`translateY(${dy}px)`;libEl.style.setProperty("--p",Math.max(.1,1-dy/420))});
    const end=()=>{if(!drag)return;drag=false;const v=dy/Math.max(1,performance.now()-t0),c=dy>120||v>.6;sh.style.transition="";sh.style.transform="";libEl.style.removeProperty("--p");if(c)closeLib()};
    el.addEventListener("pointerup",end);el.addEventListener("pointercancel",end);
  });
})();
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&libEl.classList.contains("show"))closeLib()});

/* ---------- Ajustes ---------- */
let theme=LS.get("tr_theme","dark"),backupN=LS.get("tr_backup","never");
const setEl=$("#set"),rootEl=document.documentElement;
const haptic=()=>{try{navigator.vibrate&&navigator.vibrate(8)}catch(e){}};
const PAGES={main:"Settings",theme:"Theme",play:"Play with",data:"Data"};
let page="main";

function applyTheme(){
  document.body.classList.toggle("light",theme==="light");
  const m=document.querySelector('meta[name="theme-color"]');if(m)m.content=theme==="light"?"#f6f6f4":"#000000";
}
function fit(){
  const p=setEl.querySelector('.set-page[data-p="'+page+'"]');
  $("#setView").style.height=p.firstElementChild.offsetHeight+"px";
}
function go(p,instant){
  if(instant)setEl.classList.add("nt");
  page=p;
  setEl.querySelectorAll(".set-page").forEach(el=>{
    const n=el.dataset.p;
    el.classList.toggle("on",n===p);
    el.classList.toggle("left",n==="main"&&p!=="main");
    if(n===p)el.scrollTop=0;
  });
  const t=$("#setTitle");t.textContent=PAGES[p];
  if(!instant){t.classList.remove("swap");void t.offsetWidth;t.classList.add("swap")}
  $("#setBack").classList.toggle("show",p!=="main");
  fit();
  if(instant)requestAnimationFrame(()=>requestAnimationFrame(()=>setEl.classList.remove("nt")));
}
function seg(id,attr,val){
  const s=$("#"+id),bs=[...s.querySelectorAll("button")];
  const k=Math.max(0,bs.findIndex(b=>b.dataset[attr]===String(val)));
  s.style.setProperty("--k",k);bs.forEach((b,i)=>b.classList.toggle("sel",i===k));
}
function marks(){
  seg("backup","backup",backupN);
  document.querySelectorAll("#themeList .s-row").forEach(b=>b.classList.toggle("sel",b.dataset.theme===theme));
  document.querySelectorAll("#sv .s-row").forEach(b=>b.classList.toggle("sel",b.dataset.s===service));
  $("#bkHint").textContent=backupN==="never"?T("bhNever"):backupN==="1"?T("bh1"):T("bhN",backupN);
  $("#vTheme").textContent=theme==="light"?"Light":"Dark";
  $("#vPlay").textContent=service;
  fit();
}
function openSettings(){
  marks();go("main",true);
  setEl.setAttribute("aria-hidden","false");
  setEl.classList.add("show");document.body.classList.add("set-open");
}
function closeSettings(){
  setEl.classList.remove("show");document.body.classList.remove("set-open");
  setEl.setAttribute("aria-hidden","true");
}
function setTheme(v,ev){
  if(v===theme)return;
  theme=v;LS.set("tr_theme",v);
  document.querySelectorAll("#themeList .s-row").forEach(b=>b.classList.toggle("sel",b.dataset.theme===v));
  $("#vTheme").textContent=v==="light"?"Light":"Dark";
  if(document.startViewTransition&&!matchMedia("(prefers-reduced-motion:reduce)").matches){
    const b=ev&&ev.target&&ev.target.closest&&ev.target.closest("button"),r=b?b.getBoundingClientRect():{left:innerWidth/2,top:innerHeight/2,width:0,height:0};
    rootEl.style.setProperty("--vx",(r.left+r.width/2)+"px");rootEl.style.setProperty("--vy",(r.top+r.height/2)+"px");
    document.startViewTransition(applyTheme);
  }else applyTheme();
}

setEl.addEventListener("click",e=>{
  if(e.target.classList.contains("set-scrim")){closeSettings();return}
  const b=e.target.closest("button");if(!b)return;
  const d=b.dataset;
  if(d.go){haptic();go(d.go);return}
  if(b.id==="setBack"){go("main");return}
  if(d.theme){haptic();setTheme(d.theme,e);return}
  if(d.s){if(service!==d.s){service=d.s;LS.set("tr_service",service);marks();haptic();toast(T("svc",service))}return}
  if(d.backup){backupN=d.backup;LS.set("tr_backup",backupN);LS.set("tr_since","0");marks();haptic();return}
  if(b.id==="exportData"){exportData();return}
  if(b.id==="importData"){$("#importFile").click();return}
  if(b.id==="wipe"){
    $("#confirmWipeText").textContent=T("wipeText",cnt(ALBUMS.filter(a=>a.lib).length,"alb"));
    $("#confirmWipe").classList.add("show");$("#cancelWipe").focus();return;
  }
});
$("#bSet").onclick=openSettings;

/* arrastrar para cerrar */
(function(){
  const sh=setEl.querySelector(".set-sheet");
  let y0=0,dy=0,t0=0,drag=false;
  [setEl.querySelector(".set-grab"),setEl.querySelector(".set-head")].forEach(el=>{
    el.addEventListener("pointerdown",e=>{if(e.target.closest("button"))return;drag=true;y0=e.clientY;dy=0;t0=performance.now();el.setPointerCapture(e.pointerId);sh.style.transition="none"});
    el.addEventListener("pointermove",e=>{if(!drag)return;dy=Math.max(0,e.clientY-y0);sh.style.transform=`translateY(${dy}px)`;setEl.style.setProperty("--p",Math.max(.1,1-dy/420))});
    const end=()=>{
      if(!drag)return;drag=false;
      const v=dy/Math.max(1,performance.now()-t0),close=dy>120||v>.6;
      sh.style.transition="";sh.style.transform="";setEl.style.removeProperty("--p");
      if(close)closeSettings();
    };
    el.addEventListener("pointerup",end);el.addEventListener("pointercancel",end);
  });
})();

/* exportar / importar */
const blobToData=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.onerror=()=>r(null);f.readAsDataURL(b)});
async function exportData(){
  const albums=[];
  for(const a of ALBUMS.filter(x=>x.lib)){const o={...a};o.blob=null;if(a.blob)o.blobData=await blobToData(a.blob);albums.push(o)}
  const json=JSON.stringify({app:"the-record",v:1,exported:new Date().toISOString(),settings:{service,theme,backup:backupN},albums});
  const name=`the-record-${new Date().toISOString().slice(0,10)}.json`;
  const file=new File([json],name,{type:"application/json"});
  try{
    if(navigator.canShare&&navigator.canShare({files:[file]}))await navigator.share({files:[file],title:"The Record"});
    else{const u=URL.createObjectURL(file),l=document.createElement("a");l.href=u;l.download=name;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}
  }catch(e){if(e&&e.name==="AbortError")return}
  LS.set("tr_since","0");toast(T("exported"));
}
$("#importFile").addEventListener("change",async e=>{
  const f=e.target.files[0];e.target.value="";if(!f)return;
  try{
    const d=JSON.parse(await f.text()),list=Array.isArray(d)?d:d.albums;
    if(!Array.isArray(list))throw 0;
    let n=0;
    for(const o of list){
      if(!o||!o.id||!o.t)continue;
      const a={...o};
      if(a.blobData){try{a.blob=await(await fetch(a.blobData)).blob()}catch(x){a.blob=null}delete a.blobData}
      a.blob=a.blob||null;a.lib=true;if(!a.added)a.added=Date.now();
      const i=ALBUMS.findIndex(x=>x.id===a.id);
      if(i>=0){if(urls.has(a.id)){URL.revokeObjectURL(urls.get(a.id));urls.delete(a.id)}ALBUMS[i]=a}else ALBUMS.push(a);
      await DB.put(a);n++;
    }
    if(!n)throw 0;
    render();toast(T("imported",cnt(n,"alb")));
  }catch(x){toast(T("badFile"))}
});

/* borrar todo */
const hideWipe=()=>$("#confirmWipe").classList.remove("show");
$("#cancelWipe").onclick=hideWipe;
$("#confirmWipe").onclick=e=>{if(e.target.id==="confirmWipe")hideWipe()};
$("#confirmWipeAction").onclick=async()=>{
  hideWipe();
  await DB.clear();ALBUMS=[];urls.forEach(u=>URL.revokeObjectURL(u));urls.clear();
  F={v:"all",s:"",t:"",ar:[]};LS.set("tr_lib",JSON.stringify(F));
  render();toast(T("cleared"));
};
document.addEventListener("keydown",e=>{
  if(e.key!=="Escape")return;
  if($("#confirmWipe").classList.contains("show"))hideWipe();
  else if(setEl.classList.contains("show"))closeSettings();
});

/* recordatorio de copia */
function bumpBackup(){
  if(backupN==="never")return;
  const n=(+LS.get("tr_since","0")||0)+1;
  if(n>=(+backupN||1)){LS.set("tr_since","0");setTimeout(()=>toast(T("backupNow"),4200),1900)}
  else LS.set("tr_since",String(n));
}
applyTheme();
let tt;function toast(m,ms){const t=$("#toast");t.textContent=m;t.classList.add("s");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("s"),ms||1800)}

/* ---------- Arranque ---------- */
(async function(){
  try{
    ALBUMS=await DB.all();
    const rest=ALBUMS.filter(a=>!a.lib).sort((x,y)=>y.seen-x.seen).slice(12);
    rest.forEach(a=>DB.del(a.id));ALBUMS=ALBUMS.filter(a=>!rest.includes(a));
  }catch(e){ALBUMS=[]}
  F.ar=F.ar.filter(x=>ALBUMS.some(a=>a.lib&&a.a===x));
  render();
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
})();
if("serviceWorker" in navigator&&navigator.serviceWorker.controller){let rl=0;navigator.serviceWorker.addEventListener("controllerchange",()=>{if(!rl){rl=1;location.reload()}})}
if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol))addEventListener("load",()=>navigator.serviceWorker.register("sw.js").then(r=>r.update()).catch(()=>{}));
</script>
